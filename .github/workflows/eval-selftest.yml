# Self-test of eval/local_eval.sh on a GitHub runner, with the mock House server (tests/mock_model_server.py)
# answering with canned, checker-verified scripts for four units plus one unit it has no answer for.
# Expected: "passed 4/5".  The result is also the name of the "report" job, readable from the Actions API.
name: eval-selftest

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      summary: ${{ steps.run.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      - name: Kit, sandbox base and agent image
        run: |
          git clone --depth 1 https://github.com/Agenthon-2026/track1-coding-public.git /tmp/kit
          docker build --platform linux/amd64 -t finance-bench-sandbox:latest -f /tmp/kit/docker/sandbox.Dockerfile /tmp/kit
          docker build --platform linux/amd64 -t agent:selftest .

      - name: Mock House + local_eval.sh
        id: run
        run: |
          MOCK_KIT=/tmp/kit MOCK_REQUEST_CAP=1000 MOCK_PORT=8765 python3 tests/mock_model_server.py 2>/tmp/mock.log &
          sleep 1
          MODEL_ENDPOINT=http://127.0.0.1:8765 JOBS=2 \
            UNITS="t1-merton-jump-diffusion t1-zero-coupon-bootstrapping t1-digital-barrier-options t1-momentum-backtest t1-cta-basel-capital" \
            bash eval/local_eval.sh agent:selftest /tmp/kit /tmp/res | tee /tmp/eval.log
          S="$(grep -oE 'passed [0-9]+/[0-9]+' /tmp/eval.log | tail -1)"
          echo "summary=${S:-none}" >> "$GITHUB_OUTPUT"
          echo "----- results.csv"; cat /tmp/res/results.csv
          for f in /tmp/res/logs/*.check.log; do echo "----- $f"; tail -4 "$f"; done
          echo "----- mock"; tail -20 /tmp/mock.log

  report:
    needs: selftest
    if: always()
    name: "eval-selftest ${{ needs.selftest.outputs.summary }}"
    runs-on: ubuntu-latest
    steps:
      - run: echo "${{ needs.selftest.outputs.summary }}"
